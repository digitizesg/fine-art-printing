<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" aria-label="Fine Art Printing">
  <!-- C4: Solid filled outer frame, hollow gold mat inside — more weight,
       reads more clearly at small sizes. The petrol "frame" feels more
       like a physical object. -->
  <g>
    <rect x="6" y="14" width="52" height="52" rx="2" fill="#1A3550" />
    <rect x="14" y="22" width="36" height="36" rx="1" fill="#FFFFFF" />
    <rect x="18" y="26" width="28" height="28" rx="0.5" fill="none" stroke="#D9B36C" stroke-width="1.4" />
  </g>
  <text x="78" y="48" font-family="'Lora', Georgia, serif" font-size="24" font-weight="500" fill="#1A3550" letter-spacing="-0.3">Fine Art Printing</text>
</svg>
