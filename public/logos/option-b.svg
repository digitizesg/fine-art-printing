<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" aria-label="Fine Art Printing">
  <!-- Direction B: "fap" letter mark + wordmark.
       A small petrol square with a serif "fap" ligature inside, gold inner stroke.
       Mark works as a favicon at any size. Wordmark beside in Lora. -->
  <g>
    <rect x="0" y="10" width="60" height="60" rx="8" fill="#1A3550" />
    <rect x="4" y="14" width="52" height="52" rx="5" fill="none" stroke="#D9B36C" stroke-width="0.8" opacity="0.8" />
    <text x="30" y="51" font-family="'Lora', Georgia, serif" font-size="30" font-weight="500" font-style="italic" fill="#FFFFFF" text-anchor="middle">fap</text>
  </g>
  <text x="76" y="44" font-family="'Lora', Georgia, serif" font-size="22" font-weight="500" fill="#1A3550" letter-spacing="-0.2">Fine Art Printing</text>
  <text x="76" y="60" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(26, 53, 80, 0.55)" letter-spacing="2.5">SINGAPORE</text>
</svg>
